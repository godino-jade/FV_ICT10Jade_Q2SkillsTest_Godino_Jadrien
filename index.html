<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 Drill 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">

    <style>
        body{
            background-image: url('https://img.magnific.com/free-vector/colorful-science-laboratory-equipment-green-chalkboard-background_1308-183026.jpg?semt=ais_hybrid&w=740&q=80');
            background-repeat: no-repeat;
            background-size: cover;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        
        #addclubmem{ 
            color: #F9C050;
            border-radius: 10px;
            background-color: #005F73;
            padding: 20px;
            margin: auto;
            margin-top: 10%;
            width: 80%;
            box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.52);
        }

        .button {
            background-color: rgb(15, 72, 13);
            color: white;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 300px;
        }

        h1, label{
            font-weight: bold;
        }
        
        h5{
            justify-content: center; 
            align-items: center; 
        }

        .btn{
            display: block;
            width: 100%;
            border-radius: 5px;
            background-color: #47c2af;
            color: #474929;
            font-weight: bold;
            height: 50px;
        }

        #output1{
            color: #F9C050;
            border-radius: 10px;
            background-color: #005F73;
            padding: 20px;
            margin: auto;
            margin-bottom: 10%;
            width: 80%;
            box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.52);
        }

</head>
<body>
    <div class="container">
        <div class="row" id="addclubmem">
            <div class="col-lg-12">
                <h1>Non-Metal Elements</h1>
                <h5>Periodic Table Information Finder</h5>
                
                <br>

                <form>
                    <label for="elements">Enter A Country Code:</label>
                    <br>
                    <input type="text" id="elements" class="form-control">
                    <br>
                    <button type="button" class="btn btn-warning" py-click="check_element">Check</button>
                </form>
            </div>
        </div>

        <br>

        <div class="row">
            <div class="col-lg-7" id="output1"><b>(Information WIll be shown here)</b></div>
        </div>
    </div>
     <script type="py" src="main.py"></script>
</body>
</html>
