<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 Skills Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">

    <style>
        body{
            background-image: url('https://img.magnific.com/free-vector/colorful-science-laboratory-equipment-green-chalkboard-background_1308-183026.jpg?semt=ais_hybrid&w=740&q=80');
            background-repeat: no-repeat;
            background-size: cover;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        
        .container{ 
            color: black;
            border-radius: 10px;
            background-color: #F1FFCC;
            padding-bottom: 20px;
            margin: auto;
            margin-top: 10%;
            margin-bottom: 10%;
            width: 60%;
            box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.52);
        }

        #header{
            color: #EAEA3D;
            border-top-right-radius: 10px;
            border-top-left-radius: 10px;
            padding-top: 20px;
            text-align: center;
            background-color: #1C5434;
            padding: 20px;
        }

        #instructions{
            background-color: #297a4c71;
            padding: 10px;
            border-radius: 5px;
            color: rgb(67, 66, 66);
        }

        #formbox{
            display: inline-block;
            text-align: left;
        }

        .button {
            background-color: rgb(15, 72, 13);
            color: white;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 300px;
        }

        h1, label{
            font-weight: bold;
        }
        
        h5{
            justify-content: center; 
            align-items: center; 
        }

        .btn{
            display: block;
            width: 100%;
            border-radius: 5px;
            background-color:  rgb(41, 131, 38);
            color: #EAEA3D;
            font-weight: bold;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row" id="header">
            <div class="col-lg-12">
                <h1>Non-Metal Elements</h1>
                <h5>Periodic Table Information Finder</h5>
            </div>
        </div>

        <br>

        <div class="col" id="formbox">

            <div id="instructions">
                <h5><b>Instructions:</b></h5>
                <p>Enter the <b>symbol</b> of a non-metal element (Example: H, O, Ne, Xe)</p>
            </div>

            <br>
        
            <form>
                <label for="nonmetals">🔍 Element Symbol:</label>
                <br>
                <input type="text" id="nonmetals" class="form-control">
                <br>
                <button type="button" class="btn" py-click="check_element">Check</button>
            </form>

        <br><br>

            <h5>📋Result:</h5>
                <div id="output1"></div>
        </div>
    </div>
    <script type="py" src="main.py"></script>
</body>
</html>
